name: writing review

on:
  pull_request:
  push:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  writing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run writing:check
      - run: npm run writing:test
