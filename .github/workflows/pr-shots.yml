# Screenshots of every pull request, posted to the PR as images.
#
# The problem this solves is phone-shaped. Reviewing from the GitHub mobile
# app, you can read a diff but you cannot run the thing, and the Pages URL only
# ever shows main — so the only way to see a change was to merge it and find
# out. This renders the PR's own build in a real browser and puts the pictures
# where you are already looking.
#
# It also fails the check on horizontal overflow, which is the one layout bug
# that is invisible on a desktop and, on a phone, feels like the page sliding
# under your thumb rather than anything you would file.
#
# Note: pull requests from FORKS get a read-only token, so the push and comment
# steps are skipped there. Branches in this repo — which is how the assistant
# opens PRs — work.
name: pr shots

on:
  pull_request:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: shots-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  shots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Only chromium: the other two engines are a slower download for a second
      # opinion nobody asked for.
      - name: install chromium
        run: npx playwright install --with-deps chromium

      # The PR's own source, not the committed bundle — reviewing a stale
      # bundle is exactly the failure the other workflow exists to prevent.
      - run: npm run build

      - name: shots — render at phone and desktop, fail on overflow
        run: npm run shots

      # Images have to live somewhere GitHub can serve them. A branch that is
      # only ever screenshots keeps them out of the source history and out of
      # the PR's own diff.
      - name: publish images
        if: github.event.pull_request.head.repo.full_name == github.repository
        env:
          PR: ${{ github.event.number }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          staging=$(mktemp -d)
          cp shots/*.png "$staging/"
          url="https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git"
          work=$(mktemp -d)
          if git clone --depth 1 --branch ci-shots "$url" "$work" 2>/dev/null; then
            echo "reusing ci-shots"
          else
            echo "creating ci-shots"
            git init -q "$work"
            git -C "$work" checkout -q --orphan ci-shots
            git -C "$work" remote add origin "$url"
          fi
          git -C "$work" config user.name "github-actions[bot]"
          git -C "$work" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p "$work/pr-$PR"
          cp "$staging"/*.png "$work/pr-$PR/"
          git -C "$work" add "pr-$PR"
          if git -C "$work" diff --cached --quiet; then
            echo "identical to last run, nothing to push"
          else
            git -C "$work" commit -q -m "shots for PR #$PR (${GITHUB_SHA:0:7})"
            git -C "$work" push -q origin ci-shots
          fi

      - name: comment on the PR
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.issue.number;
            const sha = context.payload.pull_request.head.sha;
            const raw = (f) =>
              `https://raw.githubusercontent.com/${context.repo.owner}/${context.repo.repo}` +
              `/ci-shots/pr-${pr}/${f}?v=${sha.slice(0, 7)}`;

            // A marker so each run edits its own comment instead of stacking a
            // new one on every push.
            const MARKER = '<!-- pr-shots -->';
            const body = [
              MARKER,
              '### How it looks',
              '',
              `Rendered from this PR's build at \`${sha.slice(0, 7)}\`. No horizontal overflow, no console errors.`,
              '',
              '| | phone · 390×844 | desktop · 1280×800 |',
              '|---|---|---|',
              `| the Fissure | <img src="${raw('phone-fissure.png')}" width="200"> | <img src="${raw('desktop-fissure.png')}" width="380"> |`,
              `| first run | <img src="${raw('phone-welcome.png')}" width="200"> | <img src="${raw('desktop-welcome.png')}" width="380"> |`,
              '',
              '---',
              '_Generated by [Claude Code](https://claude.ai/code)_',
            ].join('\n');

            const existing = await github.paginate(github.rest.issues.listComments, {
              ...context.repo, issue_number: pr, per_page: 100,
            });
            const mine = existing.find((c) => c.body?.includes(MARKER));
            if (mine) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: mine.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: pr, body });
            }
